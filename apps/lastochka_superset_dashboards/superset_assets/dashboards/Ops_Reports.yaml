      code: '**Примечание.** Интервал выбирается фильтром «Группировка» (месяц или неделя, неделя с понедельника). Покупки клиентов идут с 19.05.2026, поэтому «вернувшихся» после 90 дней пока почти нет.'
  ROW-bd258cb398:
    type: ROW
    id: ROW-bd258cb398
    children:
    - MARKDOWN-510127eece
    parents: *id033
    meta:
