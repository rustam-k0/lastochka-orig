      code: '**Примечание.** Тариф курьера = цена доставки зоны; бесплатная для клиента доставка оплачивается курьеру по цене зоны. До 23.09.2026 снимка цены нет, тариф взят по текущей цене зоны (приблизительно).'
  ROW-2e0d922728:
