    meta:
      width: 12
      height: 7
      code: '<details><summary><b>Методика</b></summary>


        * **Переход** = сегмент на дату A (начало периода) → сегмент на дату B (конец периода). Доля считается от исходного сегмента.

        * «Не было в базе» = на дату A покупок ещё не было (впервые купили между срезами).

        * В ячейке матрицы число клиентов; доля от исходного сегмента видна по итогу строки.


        Сегменты: потерянные (90+ дней без покупки), риск (31–89), новые (одна покупка за 365 дней), лучшие (R≥4 · F≥4 · M≥4), лояльные (3+ заказа), развивающиеся (остальные). Проверяются по порядку, клиент попадает в один сегмент. Дата среза = конец выбранного периода; RFM на дату считается из истории заказов (история с 19.05.2026, ежедневных снимков нет).


        </details>'
