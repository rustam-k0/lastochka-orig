  MARKDOWN-21ce569324:
    type: MARKDOWN
    id: MARKDOWN-21ce569324
    children: []
    parents:
    - ROOT_ID
    - GRID_ID
    - TABS-c5ee9f425d
    - TAB-8bd9000115
    - TABS-87d3365fb5
    - TAB-47efbd3952
    - ROW-04480d5137
    meta:
      width: 12
      height: 7
      code: '<details><summary><b>Методика</b></summary>


        * **Время** = выдал − принял (`delivery_orders.finished_at − created_at`); принял → забрал и забрал → выдал считаются по отметке «забрал» (`started_at`). Отмены и возвраты в среднее не входят; медиана и p90 считаются по заказам, а не по средним.

        * **В срок** = выдан не позже конца слота доставки.

        * **Отмены курьером.** Отдельного действия «курьер отказался» в системе нет: считается заказ, отменённый после назначения курьера. **Возврат** = в заказе есть возвращённая позиция.

        * **Оценка** = отзыв клиента на заказ (1–5).


        Источник: живая база курьерки, `delivery_orders`, `deliveries`, `orders`, `shifts`, `order_reviews`.


        </details>'
