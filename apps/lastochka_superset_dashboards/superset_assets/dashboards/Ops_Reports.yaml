      code: '**Примечание.** Доставки, закрытые меньше чем через минуту после принятия, отмечены задним числом и в средние не входят. Заказов в час и за смену считаются по сменам: курьеры открывают их редко.'
  ROW-04480d5137:
    type: ROW
    id: ROW-04480d5137
    children:
    - MARKDOWN-21ce569324
    parents: *id013
