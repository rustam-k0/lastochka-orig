    meta:
      width: 12
      height: 7
      code: '<details><summary><b>Методика</b></summary>


        * **Риск** = 31–89 дней без покупки, **потерян** = 90 и больше. Дата среза = конец выбранного периода; RFM на дату считается из истории заказов (история с 19.05.2026, ежедневных снимков нет).

        * **Удержание когорты** = клиенты когорты с покупкой в месяце жизни M / размер когорты. Когорта = месяц первой покупки, M0 = месяц первой покупки.

        * **Аудитории** = сегменты RFM на дату среза. Сегменты: потерянные (90+ дней без покупки), риск (31–89), новые (одна покупка за 365 дней), лучшие (R≥4 · F≥4 · M≥4), лояльные (3+ заказа), развивающиеся (остальные). Проверяются по порядку, клиент попадает в один сегмент.


        Источник: заказы витрины, status = delivered.


        </details>'
