      height: 7
      code: '<details><summary><b>Методика</b></summary>


        * **Средняя оценка** только по оценкам 1–5; негатив строго 1–3; отзыв без оценки не входит в среднее и долю. Одна строка = один отзыв на заказ.

        * **Динамика:** интервал по фильтру «Группировка», незавершённый интервал помечен «*», интервалы без оценок дают разрыв линии.

        * **Сегмент и RFM** клиента на конец выбранного периода. Сегменты: потерянные (90+ дней без покупки), риск (31–89), новые (одна покупка за 365 дней), лучшие (R≥4 · F≥4 · M≥4), лояльные (3+ заказа), развивающиеся (остальные). Проверяются по порядку, клиент попадает в один сегмент.


        Источник: отзывы на заказы (`order_reviews`), заказы витрины.


        </details>'
