      code: '**Примечание.** Тип ошибки проставляет оператор в карточке отзыва на заказ (админка → отзывы). Пока типы не проставлены, жалоб нет. Компенсации и жалобы на курьеров система не хранит.'
  ROW-0f1c2fe4fd:
    type: ROW
    id: ROW-0f1c2fe4fd
