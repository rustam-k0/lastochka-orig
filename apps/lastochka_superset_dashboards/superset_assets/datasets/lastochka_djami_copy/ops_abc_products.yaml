table_name: ops_abc_products
main_dttm_col: order_date
database_uuid: 5fe2883e-9e10-44ad-8cb5-22305f923603
schema: null
sql: "{% set period = get_time_filter('order_date', remove_filter=True, target_type='DATETIME') %}\n{% set shops = filter_values('shop_name', remove_filter=True) %}\n{% set p_from = period.from_expr or \"'2000-01-01 00:00:00'\" %}\n{% set p_to = period.to_expr or 'NOW() + INTERVAL 1 DAY' %}\nWITH\ncur AS (\n    SELECT\n        oi.product_id                                AS product_id,\n        SUM(oi.price_during_order * (oi.quantity - COALESCE(oi.returned_quantity, 0))) AS revenue,\n        SUM(oi.quantity - COALESCE(oi.returned_quantity, 0)) AS quantity,\n        COUNT(DISTINCT o.id)                         AS orders,\n        MAX(o.created_at)                            AS order_date\n    FROM order_items oi\n    JOIN orders o     ON o.id = oi.order_id\n    LEFT JOIN shops s ON s.id = o.shop_id\n    WHERE o.parent_order_id IS NULL\n      AND o.status_id = 5\n      AND oi.status_id <> 3\n      AND oi.deleted_at IS NULL\n      AND o.deleted_at IS NULL\n      AND COALESCE(o.client_id, 0)\
  \ <> 35\n      AND o.created_at >= {{ p_from }}\n      AND o.created_at < {{ p_to }}\n      {% if shops %}AND s.title IN {{ shops | where_in }}{% endif %}\n    GROUP BY oi.product_id\n),\nprev AS (\n    SELECT\n        oi.product_id                                AS product_id,\n        SUM(oi.price_during_order * (oi.quantity - COALESCE(oi.returned_quantity, 0))) AS revenue,\n        SUM(oi.quantity - COALESCE(oi.returned_quantity, 0)) AS quantity,\n        COUNT(DISTINCT o.id)                         AS orders,\n        MAX(o.created_at)                            AS order_date\n    FROM order_items oi\n    JOIN orders o     ON o.id = oi.order_id\n    LEFT JOIN shops s ON s.id = o.shop_id\n    WHERE o.parent_order_id IS NULL\n      AND o.status_id = 5\n      AND oi.status_id <> 3\n      AND oi.deleted_at IS NULL\n      AND o.deleted_at IS NULL\n      AND COALESCE(o.client_id, 0) <> 35\n      AND o.created_at >= DATE_SUB({{ p_from }}, INTERVAL TIMESTAMPDIFF(SECOND, {{ p_from }}, {{ p_to\
  \ }}) SECOND)\n      AND o.created_at < {{ p_from }}\n      {% if shops %}AND s.title IN {{ shops | where_in }}{% endif %}\n    GROUP BY oi.product_id\n),\ncur_r AS (\n    SELECT\n        cur.*,\n        SUM(revenue) OVER ()                         AS total_revenue,\n        SUM(revenue) OVER (ORDER BY revenue DESC, product_id\n                           ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cum_revenue\n    FROM cur\n    WHERE revenue > 0\n),\nprev_r AS (\n    SELECT\n        prev.*,\n        SUM(revenue) OVER ()                         AS total_revenue,\n        SUM(revenue) OVER (ORDER BY revenue DESC, product_id\n                           ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cum_revenue\n    FROM prev\n    WHERE revenue > 0\n)\nSELECT\n    c.product_id,\n    COALESCE(p.title, CONCAT('Товар #', c.product_id)) AS product_name,\n    COALESCE(cat4.title, cat3.title, cat2.title, cat1.title, 'Без категории')                                 AS category_name,\n\
  \    {% if shops %}'Выбранные магазины'{% else %}'Все магазины'{% endif %} AS shop_name,\n    c.revenue,\n    c.quantity,\n    c.orders,\n    c.revenue / NULLIF(c.quantity, 0)                 AS avg_price,\n    c.order_date,\n    100 * c.revenue / NULLIF(c.total_revenue, 0)      AS revenue_share_pct,\n    100 * c.cum_revenue / NULLIF(c.total_revenue, 0)  AS cum_share_pct,\n    CASE\n            WHEN (c.cum_revenue - c.revenue) < 0.80 * c.total_revenue THEN 'A'\n            WHEN (c.cum_revenue - c.revenue) < 0.95 * c.total_revenue THEN 'B'\n            ELSE 'C'\n        END                        AS abc_class,\n    {% if period.from_expr %}CASE\n        WHEN pr.product_id IS NULL THEN 'Новый в продажах'\n        WHEN CASE\n            WHEN (pr.cum_revenue - pr.revenue) < 0.80 * pr.total_revenue THEN 'A'\n            WHEN (pr.cum_revenue - pr.revenue) < 0.95 * pr.total_revenue THEN 'B'\n            ELSE 'C'\n        END = CASE\n            WHEN (c.cum_revenue - c.revenue) < 0.80 * c.total_revenue\
  \ THEN 'A'\n            WHEN (c.cum_revenue - c.revenue) < 0.95 * c.total_revenue THEN 'B'\n            ELSE 'C'\n        END THEN 'Без изменений'\n        ELSE CONCAT(CASE\n            WHEN (pr.cum_revenue - pr.revenue) < 0.80 * pr.total_revenue THEN 'A'\n            WHEN (pr.cum_revenue - pr.revenue) < 0.95 * pr.total_revenue THEN 'B'\n            ELSE 'C'\n        END, ' → ', CASE\n            WHEN (c.cum_revenue - c.revenue) < 0.80 * c.total_revenue THEN 'A'\n            WHEN (c.cum_revenue - c.revenue) < 0.95 * c.total_revenue THEN 'B'\n            ELSE 'C'\n        END)\n    END{% else %}'Нет данных'{% endif %}                                     AS class_change\nFROM cur_r c\nLEFT JOIN prev_r pr ON pr.product_id = c.product_id\nLEFT JOIN products p ON p.id = c.product_id\nLEFT JOIN category_product catp ON catp.product_id = c.product_id\n  LEFT JOIN categories cat1 ON cat1.id = catp.category_id\n  LEFT JOIN categories cat2 ON cat2.id = cat1.parent_id\n  LEFT JOIN categories cat3\
  \ ON cat3.id = cat2.parent_id\n  LEFT JOIN categories cat4 ON cat4.id = cat3.parent_id\n"
