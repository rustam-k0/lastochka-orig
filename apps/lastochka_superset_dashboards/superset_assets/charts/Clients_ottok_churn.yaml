# ДОПУЩЕНИЕ: окно оттока 90 дней без нового заказа - индустриальный дефолт
# для доставки продуктов/еды, требует согласования с заказчиком (см. notes
# BUILD_PLAN). На dev на момент импорта eligible_for_churn_90d = 0 у всех
# клиентов (ни один first_order_dt не старше 90 дней) - метрика вернёт NULL
# (0/0 через NULLIF) - ПУСТО-ОЖИДАЕМО, не баг.
slice_name: Отток клиентов (churn), %
viz_type: big_number_total
params:
  viz_type: big_number_total
  metric:
    expressionType: SQL
    sqlExpression: SUM(is_churned_90d) * 100.0 / NULLIF(SUM(eligible_for_churn_90d), 0)
    label: Отток 90д, %
    hasCustomLabel: true
  adhoc_filters: []
  subheader: ''
  header_font_size: 0.4
  subheader_font_size: 0.15
  y_axis_format: SMART_NUMBER
dataset_uuid: fd10cf03-92d6-4378-b53d-89f878a9beff
uuid: cfe7cbcd-1d6e-4504-8b30-10d8f00c05ac
version: 1.0.0
