# Вкладка «Спрос». Search-to-cart конверсия, % по дням. ДОПУЩЕНИЕ (правило 6):
# привязка поиска к cart.item_added по session_id + 30-минутное окно -
# эвристика, см. комментарий в датасете an_search_to_cart. Пусто-ожидаемо:
# выборка на dev - 1 сессия.
slice_name: 'Search-to-cart конверсия, %'
viz_type: echarts_timeseries_line
params:
  viz_type: echarts_timeseries_line
  metrics:
  - expressionType: SQL
    sqlExpression: AVG(converted_to_cart) * 100
    label: Search-to-cart, %
    hasCustomLabel: true
  groupby: []
  x_axis: event_date
  time_grain_sqla: P1D
  adhoc_filters: []
  row_limit: 10000
  comparison_type: values
  x_axis_sort_asc: true
  y_axis_format: SMART_NUMBER
