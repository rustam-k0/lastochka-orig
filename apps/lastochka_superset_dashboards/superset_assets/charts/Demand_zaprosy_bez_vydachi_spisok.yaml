# Вкладка «Спрос». Тот же датасет и логика, что и в Demand_deficity_poisk_
# bez_rezultata (BUILD_PLAN явно допускает переиспользование виджета/чарта) -
# отдельный chart-объект под отдельную ячейку макета «Дефициты».
slice_name: Запросы без выдачи результата (список)
viz_type: table
params:
  viz_type: table
  query_mode: aggregate
  groupby:
  - search_query
  - store_id
  - event_date
  metrics:
  - expressionType: SIMPLE
    column:
      column_name: search_query
    aggregate: COUNT
    label: Запросов без результата
    hasCustomLabel: true
  adhoc_filters:
  - expressionType: SIMPLE
    subject: results_count
    operator: '=='
    comparator: 0
    clause: WHERE
  row_limit: 1000
  order_desc: true
  table_timestamp_format: smart_date
  show_cell_bars: true
