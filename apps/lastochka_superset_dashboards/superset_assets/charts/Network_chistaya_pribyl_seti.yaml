# Вкладка «Обзор сети». СНЯТО с blocked правилом 8: NULL-safe COGS (products.
# cost_price) + опекс всей сети (network_opex_current, MAX() - одно и то же
# значение на каждой строке, см. комментарий в датасете). На dev cost_price
# пуст у всех товаров -> метрика = NULL (корректно, не подменена нулём).
slice_name: 'Обзор сети: Чистая прибыль сети'
viz_type: big_number_total
params:
  viz_type: big_number_total
  metric:
    expressionType: SQL
    sqlExpression: (SUM(CASE WHEN status_id = 5 THEN amount ELSE 0 END) - SUM(CASE WHEN status_id = 5 THEN order_cogs END)) - MAX(network_opex_current)
    label: Чистая прибыль сети, ₽
    hasCustomLabel: true
  adhoc_filters: []
  subheader: 'NULL пока себестоимость (1С) не заполнена'
  header_font_size: 0.4
  subheader_font_size: 0.15
  y_axis_format: SMART_NUMBER
