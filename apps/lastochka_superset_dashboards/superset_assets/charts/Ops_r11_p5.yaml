slice_name: Аудитории для возврата
description: null
viz_type: table
params:
  viz_type: table
  query_mode: aggregate
  groupby:
  - segment
  metrics:
  - &id001
    expressionType: SQL
    sqlExpression: COUNT(*)
    label: Клиентов
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: COUNT(*) / NULLIF(SUM(COUNT(*)) OVER (), 0)
