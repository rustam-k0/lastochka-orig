slice_name: 'Факт vs цель: Repeat rate %'
viz_type: gauge_chart
params:
  viz_type: gauge_chart
  metric:
    expressionType: SQL
    sqlExpression: COUNT(DISTINCT CASE WHEN client_order_seq > 1 THEN client_id END)
      * 100.0 / NULLIF(COUNT(DISTINCT client_id), 0)
    label: Repeat rate, %
    hasCustomLabel: true
  groupby: []
  adhoc_filters: []
  row_limit: 10
  start_angle: 225
  end_angle: -45
  min_val: 0
  max_val: 100
  value_formatter: '{value}'
