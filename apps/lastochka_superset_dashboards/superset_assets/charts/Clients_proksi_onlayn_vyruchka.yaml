# Прокси "Онлайн" выручки (см. notes датасета store_monthly_revenue -
# store_id НЕ маппится на shop_id курьерки, нативный фильтр вкладки «по
# магазину» этим датасетом не управляет).
slice_name: 'Прокси ''Онлайн'': выручка интернет-магазина по месяцам'
