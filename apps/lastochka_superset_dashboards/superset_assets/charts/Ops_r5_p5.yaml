slice_name: Детализация показателей
description: null
viz_type: table
params:
  viz_type: table
  query_mode: aggregate
  groupby:
  - courier_name
  metrics:
  - expressionType: SQL
    sqlExpression: SUM(is_cash_delivered)
    label: Нал, заказов
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: MAX('Нет данных')
    label: Карта, заказов
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: SUM(is_online_delivered)
    label: Онлайн, заказов
    hasCustomLabel: true
  - &id001
    expressionType: SQL
    sqlExpression: SUM(cash_amount)
    label: К инкассации, ₽
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: MAX('Нет данных')
    label: Сдано, ₽
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: MAX('Нет данных')
    label: Расхождение, ₽
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: SUM(cash_amount) / NULLIF(SUM(is_cash_delivered), 0)
    label: Средний чек нал, ₽
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: SUM(online_amount) / NULLIF(SUM(is_online_delivered), 0)
    label: Средний чек онлайн, ₽
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: SUM(cash_amount) / NULLIF(SUM(delivered_amount), 0)
    label: Доля наличных
    hasCustomLabel: true
  percent_metrics: []
  adhoc_filters:
  - clause: WHERE
    comparator: No filter
