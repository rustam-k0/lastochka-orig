      d3NumberFormat: $,.0f
      horizontalAlign: right
    Средний чек нал, ₽:
      d3NumberFormat: $,.0f
      horizontalAlign: right
    Средний чек онлайн, ₽:
      d3NumberFormat: $,.0f
      horizontalAlign: right
    Доля наличных:
      d3NumberFormat: .1%
      horizontalAlign: right
  timeseries_limit_metric: *id001
