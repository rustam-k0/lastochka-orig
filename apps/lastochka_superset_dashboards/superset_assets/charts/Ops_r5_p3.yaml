slice_name: Способы оплаты
description: Сумма доставленных заказов после возвратов
viz_type: pie
params:
  viz_type: pie
  groupby:
  - payment_method
  metric:
    expressionType: SQL
    sqlExpression: SUM(delivered_amount)
    label: Сумма, ₽
    hasCustomLabel: true
  adhoc_filters:
  - clause: WHERE
    comparator: No filter
    expressionType: SIMPLE
    operator: TEMPORAL_RANGE
    subject: accepted_at
  - clause: WHERE
    expressionType: SQL
    sqlExpression: is_delivered = 1
  row_limit: 6
  sort_by_metric: true
  color_scheme: lastochkaOps
  show_labels: true
  labels_outside: true
  label_line: true
  label_type: value_percent
  show_labels_threshold: 3
  number_format: $,.0f
  show_legend: true
  legendType: scroll
  legendOrientation: right
  donut: true
  innerRadius: 55
  outerRadius: 80
  show_total: false
cache_timeout: null
