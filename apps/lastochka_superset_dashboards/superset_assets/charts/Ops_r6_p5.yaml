slice_name: Детализация показателей
description: null
viz_type: table
params:
  viz_type: table
  query_mode: aggregate
  groupby:
  - zone_name
  metrics:
  - &id001
    expressionType: SQL
    sqlExpression: COUNT(*)
    label: Заказов
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: COUNT(*) / NULLIF(SUM(COUNT(*)) OVER (), 0)
    label: Доля
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: AVG(delivery_minutes)
    label: Среднее время, мин
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: SUM(is_cancelled) / NULLIF(COUNT(*), 0)
    label: Отмены
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: SUM(delivered_amount) / NULLIF(SUM(is_delivered), 0)
    label: Средняя выручка/заказ, ₽
    hasCustomLabel: true
  - expressionType: SQL
    sqlExpression: COUNT(DISTINCT courier_name)
    label: Курьеров
    hasCustomLabel: true
  percent_metrics: []
  adhoc_filters:
  - clause: WHERE
    comparator: No filter
    expressionType: SIMPLE
    operator: TEMPORAL_RANGE
    subject: accepted_at
  row_limit: 10000
  server_pagination: false
  page_length: 12
  include_search: true
  show_cell_bars: false
  show_totals: false
  allow_rearrange_columns: false
  allow_render_html: false
  table_timestamp_format: '%d.%m.%Y'
  color_pn: false
  order_desc: true
  column_config:
    Заказов:
      d3NumberFormat: ',d'
      horizontalAlign: right
    Доля:
      d3NumberFormat: .1%
      horizontalAlign: right
    Среднее время, мин:
      d3NumberFormat: ',.1f'
      horizontalAlign: right
    Отмены:
      d3NumberFormat: .1%
      horizontalAlign: right
    Средняя выручка/заказ, ₽:
      d3NumberFormat: $,.0f
      horizontalAlign: right
    Курьеров:
      d3NumberFormat: ',d'
      horizontalAlign: right
  timeseries_limit_metric: *id001
cache_timeout: null
