extend type Mutation {
  PrinterUpdate(
    "ID принтера"
    id: Int!
    "Название принтера"
    title: String
    "IP-адрес"
    ip_address: String
    "Порт"
    port: Int
    "Активен"
    is_active: Boolean
  ): DefaultResponse @field(resolver: "Printer\\PrinterUpdate")
  @validator(class: "Printer\\PrinterUpdateValidator")
  @guard @can(model: "Admin", ability: "onlyAdmin") @section(key: "printers")
}
