extend type Mutation {
  ClientUpdate(
    "ID клиента"
    id:Int!
    "Имя"
    name:String
    "Фамилия"
    surname:String
    "Отчество"
    patronymic:String
    "Почта"
    email:String
    "Дата рождения"
    birthday:DateTime
    "Пол (1 — мужской, 2 — женский)"
    gender_type_id:Int
    "Примечание администратора (до 2000 символов, не синхронизируется в storefront)"
    admin_note:String
  ):DefaultResponse   @field(resolver:"Client\\ClientUpdate")
  @validator(class:"Client\\ClientUpdateValidator")
  @guard @can(model: "Admin",ability: "onlyAdmin") @section(key: "clients")
}
