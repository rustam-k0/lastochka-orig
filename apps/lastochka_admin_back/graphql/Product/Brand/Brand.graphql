"Бренд"
type Brand {
  "ID"
  id: Int!
  "Название"
  title: String!
  "Ссылка (URL перехода)"
  link: String
  "Страна происхождения (родина бренда)"
  country_origin: String
  "Код страны происхождения (ISO 3166-1 alpha-2)"
  country_origin_code: String
  "Страна производства"
  country_production: String
  "Код страны производства (ISO 3166-1 alpha-2)"
  country_production_code: String
  "Путь к файлу сертификата официального дилера (PDF)"
  certificate_path: String
  "Оригинальное имя файла сертификата"
  certificate_name: String
  "Позиция для сортировки"
  position: Int
  "Активность"
  is_active: Boolean
  "Дата создания"
  created_at: DateTime
  "Дата обновления"
  updated_at: DateTime

  "Логотип"
  logoImage: Img @hasOne(relation: "logoImage")

  "Динамические чекбоксы (JSON-строка map field => bool)"
  custom_checkboxes: String
}
