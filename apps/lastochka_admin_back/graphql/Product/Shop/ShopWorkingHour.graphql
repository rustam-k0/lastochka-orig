type ShopWorkingHour {
  """
  Дни работы магазина
  MONDAY = 1
  TUESDAY = 2
  WEDNESDAY = 3
  THURSDAY = 4
  FRIDAY = 5
  SATURDAY = 6
  SUNDAY = 7
  """
  day_of_week:Int
