type Shop {
  "ID"
  id:Int
  "Город"
  city: City @belongsTo
  "ID города"
  city_id: Int
  "Магазин по умолчанию в своём городе (не более одного на город)"
  is_default: Boolean
  "Название"
  title:String
  "Категории партнера"
  categories:[Category] @hasMany
  "Часы работы"
  working_days:[Int] @method(name: "getWorkingDaysAsArray") @with(relation: "workingHours")
  "Тип работы магазина"
  work_type_id:Int @method(name: "getWorkType") @with(relation: "workingHours")
  "Время открытия магазина."
  opening_time:String @method(name: "getGetOpeningTime") @with(relation: "workingHours")
  "Время закрытия магазина."
  closing_time:String @method(name: "getGetClosingTime") @with(relation: "workingHours")
  "Сотрудники, работающие в магазине"
  workers:[UserShop] @hasMany
  "Зоны доставки"
  zones:[ShopZone] @hasMany
  "Телефон"
  phone:String
  "Почта"
  email:String
  "Временной слот"
  slot_time:String
  "Макс. количество заказов на 1 слот"
  slot_max_orders:String
  "Широта"
  latitude:String
  "Долгота"
  longitude:String
  "Адрес"
  address:String
  "Главное изображение"
  img: Img @hasOne(relation:"img")
  "График работы"
  schedule:String
  "Изображение лого"
  logo_img:Img @hasOne(relation:"logoImg")
  "Изображение бэкграунд"
  background_img:Img @hasOne(relation:"backgroundImg")
  "Комиссия агрегатора"
  commission:Float
  "Площадь магазина, м²"
  area_sqm: Float
  "Тип заведения: 1 - магазин, 2 - кафе"
  type_id:Int
  "Описание"
  description:String
  "Депозит"
  deposit:Float
  """Когда списывать средства
  1 - Списывание оплаты после сборки заказа
  2 - Списывание оплаты после оформления заказа
  3 - Списывание оплаты после начала сборки
  4 - Списывание оплаты после доставки
  """
  payment_type_id:Int
  is_popular:Boolean
  "B2B-магазин (оптовый склад)"
  is_b2b:Boolean
  status_id: Int
  ignore_stock: Boolean
  code: String
  "Бонусная программа включена"
  is_bonus_enabled: Boolean
  "Процент начисления бонусов (0-100)"
  bonus_earn_percent: Int
  "Максимальный процент списания бонусов (0-100)"
  bonus_spend_percent: Int
  "Самовывоз включён"
  is_pickup_enabled: Boolean
  "Минимальная сумма заказа для самовывоза"
  min_pickup_order_amount: Int
  "Порог «Тяжёлого заказа» в граммах (модуль heavy_orders); null — порог не задан"
  heavy_order_threshold: Int
  "Стоимость сборки в рублях (модуль assembly_cost); null — не задана"
  assembly_price: Int
  "Доступные способы оплаты при самовывозе"
  pickup_payment_methods: String
  "Автоматическая отмена самовывоза при просрочке"
  pickup_auto_cancel_enabled: Boolean
  "Часы ожидания скоропортящихся товаров при самовывозе"
  pickup_wait_perishable_hours: Int
  "Часы ожидания обычных товаров при самовывозе"
  pickup_wait_regular_hours: Int
  "Часы грейс-периода для самовывоза"
  pickup_grace_period_hours: Int
  "Динамические чекбоксы (JSON-строка map field => bool)"
  custom_checkboxes:String
}

type UserShop {
  id:Int
  shop_id:Int
  shop:Shop @hasOne
  user:User @hasOne
  "Часы работы"
  working_days:[Int] @method(name: "getWorkingDaysAsArray") @with(relation: "workingHours")
  "Время открытия магазина."
  opening_time:String @method(name: "getGetOpeningTime") @with(relation: "workingHours")
  "Время закрытия магазина."
  closing_time:String @method(name: "getGetClosingTime") @with(relation: "workingHours")
}
