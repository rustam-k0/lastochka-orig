extend type Mutation {
  "Установить график работы сотрудников"
  SetUserWorkingHours(
    "ID связки магазина и пользователя"
    user_shop_id:Int
    "Время открытия магазина. Нужно в случае type_id = 1"
    opening_time:String
    "Время закрытия магазина. Нужно в случае type_id = 1"
    closing_time:String
    """
    Дни работы магазина
      MONDAY = 1
      TUESDAY = 2
      WEDNESDAY = 3
      THURSDAY = 4
      FRIDAY = 5
      SATURDAY = 6
      SUNDAY = 7
    """
    days:[Int]
  ):DefaultResponse  @field(resolver:"Shop\\SetUserWorkingHours")
  @validator(class:"Shop\\SetUserWorkingHoursValidator")
  @guard @can(model: "Admin",ability: "onlyAdmin")
}
