extend type Mutation {

    AssemblyZoneUpdate(
        "ID зоны"
        id: Int!
        "Название зоны"
        title: String
        "Цветовое обозначение (HEX)"
        color: String
        "Активность зоны (вкл/выкл)"
        is_active: Boolean
        "Описание / комментарий"
        description: String
        "Позиция"
        position: Int
    ): DefaultResponse
        @field(resolver: "AssemblyZone\\AssemblyZoneUpdate")
        @validator(class: "AssemblyZone\\AssemblyZoneUpdateValidator")
        @guard @can(model: "Admin", ability: "onlyAdmin")

}
