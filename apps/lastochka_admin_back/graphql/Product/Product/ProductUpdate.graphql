    "Товар без сахара"
    sugar_free:Boolean
    "Показывать на странице поиска"
    on_search_page:Boolean
    "Подаётся тёплым"
    served_warm:Boolean
    "Товар доступен только для самовывоза"
    pickup_only:Boolean
    "Товар 18+ — продажа только совершеннолетним"
    adult_only:Boolean
    "Маркируемый товар (Честный знак)"
