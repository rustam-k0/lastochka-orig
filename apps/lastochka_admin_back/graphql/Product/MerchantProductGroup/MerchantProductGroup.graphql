"Товарная группа мерчанта"
type MerchantProductGroup {
  "ID"
  id: Int!
  "ID магазина"
  shop_id: Int!
  "Название группы"
  title: String!
  "Описание проекта"
  description: String
  "Мета-данные (SEO, доп. информация) в формате JSON"
  meta: String
  "Выводить на главную"
  show_on_main: Boolean
  "Выводить на странице мерчанта"
  show_on_merchant_page: Boolean
  "Выводить в каталоге мерчанта"
  show_in_merchant_catalog: Boolean
  "Выводить на странице поиска"
  show_on_search: Boolean
  "Порядок сортировки"
  sort_order: Int
  "Активность"
  is_active: Boolean
  "Рекомендуемая группа товаров"
  is_recommended: Boolean
  "Показывать в корзине"
  is_cart_page: Boolean
  "Комплексное решение (фасетный каталог вместо мест размещения)"
  is_complex_solution: Boolean
  "Способ наполнения: manual | purchase_history | viewed_not_bought | is_new | is_hurry_up"
  fill_type: String
  "Динамические чекбоксы (JSON-строка map field => bool)"
  custom_checkboxes: String
  "Дата создания"
  created_at: DateTime
  "Дата обновления"
  updated_at: DateTime

  "Количество товаров в группе"
  products_count: Int @method(name: "getProductsCountAttribute")

  "Изображение группы"
  image: Img @hasOne(relation: "image")
  "Магазин"
  shop: Shop! @belongsTo
  "Товары группы (pivot: sort_order, quantity)"
  products: [Product!] @belongsToMany
  "Значения фильтров комплексных решений"
  filterValues: [ProductGroupFilterValue] @belongsToMany
}
