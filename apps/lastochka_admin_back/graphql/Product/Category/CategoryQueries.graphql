extend type Query {

  "Родительские категории"
  parent_categories:[Category] @all(scopes: ["parent"])

  admin_categories(
    ordering:[DefaultOrdering]
  ):[Category] @all(scopes: ["sorter","filter"]) @guard @can(model: "Admin",ability: "onlyAdmin") @section(key: "categories")

  admin_categories_paginate(
    title:String
    ordering:[DefaultOrdering]
  ):[Category] @paginate(defaultCount: 10, maxCount: 1000, scopes: ["sorter","filter"]) @guard @can(model: "Admin",ability: "onlyAdmin") @section(key: "categories")

  admin_categories_item(
    id: Int @eq
    ordering:[DefaultOrdering]
  ):Category @find(scopes: ["sorter","filter"]) @guard @can(model: "Admin",ability: "onlyAdmin") @section(key: "categories")

  categories(
    ordering:[DefaultOrdering]
  ):[Category] @all(scopes: ["sorter","filter",])

  "Получить категории, у которых нет дочерних категорий"
  child_categories:[Category] @all(scopes: ["onlyChild"])

  "Получить категории, которые закреплены за партнером"
  shop_categories(
    shop_id:Int
  ):[ShopCategoryTreeNode] @field(resolver: "GetShopCategories") @guard
  @can(ability: "onlyShop",model: "Shop")


}
