""" Цена за определенное количество товара
Например если value = 100, step = 3
значит 3 единицы товара это минимум, который может купить клиент

так же он может добавить step, т. е. купить 6 единиц за 200
"""
type Price {
  "Цена за шаг"
  value:Float
  "Минимальное количество товара для покупки"
  step:Float
  "Сырая цена 1С за наименьшую единицу семейства (грамм/мл/штука) — база пересчёта цены за квант"
  price_per_small_unit:Float
  "Цена без скидки (если есть скидка — исходная цена до её применения)"
  price_without_discount:Float
  "ID магазина"
  shop_id:Int
  "Магазин"
  shop:Shop @hasOne
}
