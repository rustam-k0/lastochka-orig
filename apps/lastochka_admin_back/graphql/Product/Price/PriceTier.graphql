"Ступень цены товара в магазине (цены от количества, MID-308)"
type PriceTier {
  "ID магазина ступени"
  shop_id: Int!
  "Порог: от какого количества действует цена, в базовых единицах товара (шт, кг, л)"
  min_quantity: Float!
  "Цена за базовую единицу товара на этой ступени"
  value: Float!
}

"Ступень лесенки «цены от количества» при ручном вводе (MID-308)"
input PriceTierInput {
  "Порог: от какого количества действует цена, в базовых единицах товара, > 0"
  min_quantity: Float! @rules(apply: ["numeric", "min:0.001"], attribute: "порог количества")
  "Цена за базовую единицу товара, > 0"
  value: Float! @rules(apply: ["numeric", "min:0.01"], attribute: "цена ступени")
}
