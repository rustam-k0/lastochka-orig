"Тип перехода истории"
enum StoryLinkType {
  NONE @enum(value: "none")
  PRODUCT @enum(value: "product")
  SHOP @enum(value: "shop")
  EXTERNAL @enum(value: "external")
}

"История (сторис)"
type Story {
  "ID"
  id: Int!
  "Название истории"
  title: String!
  "Дата и время окончания показа"
  expires_at: DateTime!
  "Тип перехода"
  link_type: StoryLinkType
  "ID товара (если link_type = product)"
  product_id: Int
  "ID магазина (если link_type = shop)"
  shop_id: Int
  "Внешняя ссылка (если link_type = external)"
  external_url: String
  "Позиция для сортировки"
  position: Int
  "Активность"
  is_active: Boolean
  "Быстрая категория"
  is_quick_category: Boolean
  "Динамические чекбоксы (JSON-строка map field => bool)"
  custom_checkboxes: String
  "Дата создания"
  created_at: DateTime
  "Дата обновления"
  updated_at: DateTime

  "Превью изображение"
  thumbnailImage: Img @hasOne(relation: "thumbnailImage")
  "Изображения слайдера"
  images: [Img!] @hasMany(relation: "images")
  "Связанный товар"
  product: Product @belongsTo
  "Связанный магазин"
  shop: Shop @belongsTo
}
