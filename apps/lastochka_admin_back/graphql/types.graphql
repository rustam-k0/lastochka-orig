"Изображение"
type Img {
  "id изображения (table: img)"
  id: Int
  "Путь к изображению"
  path: String
  "Название изображения"
  origin_name: String
  "Текст при неуспешной загрузке изображения"
  alt: String
  "Размер изображения (1.3 Мб)"
  size: String
  "Тип изображения (jpg, png)"
  type: String
  links:[ImageLink] @hasMany
}

type AppInfo {
  version: String
}

type ImageLink {
  id:Int
  "Параметры изображения"
  query:String
  "Путь к изображению"
  path:String
}

"Файл"
type Document {
  "id файла (table: documents)"
  id: Int
  "Путь к изображению"
  path: String
  "Название файла"
  origin_name: String
  "Текст при неуспешной загрузке файла"
  alt: String
  "Размер файла (1.3 Мб)"
  size: String
  "Тип файла (docx, pdf)"
  type: String
}

type FileResponse {
  path: String
  origin_name: String
  size: String
  type: String
}

type DefaultResponse {
  code: Int
  message: String
}

type LoginResponse {
  code: Int
  message: String
  token: String
  user: User
  "Состояние 2FA: disabled | setup | required | verified"
  two_factor: String
  "Зашифрованный challenge-токен для шага подтверждения 2FA"
  challenge: String
  "Base32-секрет (только при two_factor=setup)"
  two_factor_secret: String
  "otpauth:// URL (только при two_factor=setup)"
  otpauth_url: String
  "QR-код в виде data:image/svg+xml (только при two_factor=setup)"
  qr: String
}

type UploadedImage {
  path: String
  origin_name: String
  size: String
  type: String
}

type EmailConfirmResponse {
  code: Int
  message: String
  user: User
  token: String
}

type Role {
  id:Int
  name_ru:String
  name:String
  scope_type:String
  is_system:Boolean
  "Ключи разделов, доступных роли (для матрицы)"
  section_keys:[String!]! @field(resolver: "App\\GraphQL\\Queries\\Role\\RoleFields@sectionKeys")
  "Ключи действий с заказами, доступных роли (для матрицы)"
  order_action_keys:[String!]! @field(resolver: "App\\GraphQL\\Queries\\Role\\RoleFields@orderActionKeys")
}

type AppInfo {
  version:String
}
