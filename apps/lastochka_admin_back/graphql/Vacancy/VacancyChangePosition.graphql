extend type Mutation {
  "Изменение порядка отображения вакансии"
  VacancyChangePosition(
    "ID вакансии"
    id: Int!
    "Новая позиция"
    position: Int!
  ): Vacancy! @field(resolver: "Vacancy\\VacancyChangePosition")
