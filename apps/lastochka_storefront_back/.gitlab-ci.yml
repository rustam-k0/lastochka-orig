variables:
  BACKEND_DIR: "/home/admin/apps/lastochka_storefront_back"

deploy_dev:
  stage: deploy
  tags:
    - lastochka
  script:
    - git config --global --add safe.directory $BACKEND_DIR
    - cd $BACKEND_DIR
    - git pull
    - php8.4 /usr/local/bin/composer install
    - php8.4 artisan migrate --force
    - php8.4 artisan search:sync-settings
    - sudo supervisorctl restart all
  only:
    - main

deploy_prod:
  stage: deploy
  tags:
    - lastochka-prod
  script:
    - git config --global --add safe.directory $BACKEND_DIR
    - cd $BACKEND_DIR
    - git pull
    - php8.4 /usr/local/bin/composer install
    - php8.4 artisan migrate --force
    - php8.4 artisan search:sync-settings
    - sudo supervisorctl restart djami-storefront-queue:* djami-storefront-outbox:* djami-storefront-consume:*
  only:
    - main
