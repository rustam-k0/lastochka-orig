services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./:/var/www
      - ./_docker/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8034:80"
    depends_on:
      - storefront_app
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    networks:
      - alladin_retail

  storefront_app:
    build:
      context: .
      dockerfile: _docker/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www
    container_name: ${COMPOSE_PROJECT_NAME}
    networks:
      - alladin_retail
    depends_on:
      - meilisearch

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: ${COMPOSE_PROJECT_NAME}-meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_ENV=${MEILI_ENV:-development}
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY:-masterKey}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - alladin_retail
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  alladin_retail:
    external: true

volumes:
  meilisearch_data:
