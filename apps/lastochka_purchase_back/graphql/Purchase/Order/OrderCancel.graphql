extend type Mutation {
  OrderCancel(
    "Order -> id"
    order_id:Int
    "ID причины из справочника order_cancel_reasons (опционально, если указан custom_reason)"
    reason_id:Int
    "Свободный текст причины — используется для варианта «Другое» или когда reason_id не передан"
    custom_reason:String
  ):DefaultResponse @field(resolver: "Order\\OrderCancel")
  @validator(class: "Order\\OrderCancelValidator")
  @guard(with: ["client","api"])
  @orderAction(key: "cancel")
}
