""" Цена за определенное количество товара
Например если value = 100, step = 3
значит 3 единицы товара это минимум, который может купить клиент

так же он может добавить step, т. е. купить 6 единиц за 200
"""
type Price {
  "Цена за шаг"
  value:Float
  "Минимальное количество товара для покупки"
  step:Int
  "Цена за кг"
  price_per_kg:Float
  "Цена без скидки"
  price_without_discount:Float
}
