services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./:/var/www
      - ./_docker/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8032:80"
    depends_on:
      - purchase_app
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    networks:
      - alladin_retail

  purchase_app:
    build:
      context: .
      dockerfile: _docker/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www
    container_name: ${COMPOSE_PROJECT_NAME}
    networks:
      - alladin_retail

networks:
  alladin_retail:
    external: true
