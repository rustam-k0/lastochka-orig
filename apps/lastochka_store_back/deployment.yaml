apiVersion: apps/v1
kind: Deployment
metadata:
  name: zelenoe-store-back
  labels:
    app: zelenoe_store_back
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zelenoe_store_back
  template:
    metadata:
      labels:
        app: zelenoe_store_back
    spec:
      containers:
        - name: zelenoe-store-back
          image: gitlab.comrades.dev:5050/comrades-developers/zelenoe_store_back:latest
          ports:
            - containerPort: 80
      imagePullSecrets:
        - name: zelenoe-store-back
      nodeSelector:
        app: zelenoe_store_back
---
apiVersion: v1
kind: Service
metadata:
  name: zelenoe-store-back
  labels:
    app: zelenoe_store_back
spec:
  selector:
    app: zelenoe_store_back
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 80
      nodePort: 30090
  type: NodePort
