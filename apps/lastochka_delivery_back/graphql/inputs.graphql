input DefaultOrdering {
  orderColumn: String!
  orderBy: String! @rules(apply: ["in:asc,desc,ASC,DESC"])
}

input ImgInput {
  id: Int
  "Путь к изображению"
  path: String!
  "Название изображения"
  origin_name: String!
  "Текст при неуспешной загрузке изображения"
  alt: String
  "Размер изображения (1.3 Мб)"
  size: String
  "Тип изображения"
  type: String
}

input PackageInput {
  "Место пакета"
  type_id:Int
  "Количество пакетов"
  quantity:Int
}
