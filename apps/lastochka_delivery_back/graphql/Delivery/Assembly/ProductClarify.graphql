extend type Mutation {
  "Отправить товар на статус 'Уточнить'"
  ProductClarify(
    "AssemblyItem -> id"
    id:Int
    "ID причины уточнения (опционально, из справочника explain_reasons)"
    explain_reason_id:Int
    "ID причины отмены (опционально, из справочника product_cancel_reasons)"
    cancel_reason_id:Int
  ):DefaultResponse @guard @field(resolver: "Assembly\\ProductClarify")
  @validator(class: "Assembly\\ProductClarifyValidator")
  @can(model: "Admin",ability: "onShift")
}
