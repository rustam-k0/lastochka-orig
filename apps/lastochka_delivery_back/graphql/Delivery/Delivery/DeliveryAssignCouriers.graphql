extend type Mutation {
  """
  Сборщик назначает курьера(ов) на заказ после сборки. Для тяжёлого заказа
  (is_heavy, при включённом heavy_orders) можно передать несколько курьеров —
  совместная доставка. Доступно при включённом модуле heavy_orders или courier_assignment.

  Повторный вызов ДОБАВЛЯЕТ курьеров: уже назначенные пропускаются, снять
  назначение мутация не может. Список назначенных — в Order.couriers.

  Ошибки приходят человекочитаемым текстом в message (показывать как есть):
  «Заказ еще не готов к доставке», «Заказ уже был взят в доставку»,
  «Курьер {ФИО} не на смене в этом магазине — обновите список курьеров»,
  «Несколько курьеров можно назначить только на тяжёлый заказ»,
  «Заказ не оплачен: спишите оплату перед назначением курьера» (модуль collector_payment),
  «Назначение курьеров отключено» (оба модуля выключены)
  """
  DeliveryAssignCouriers(
    "ID заказа. Допустим id подзаказа зоны сборки — назначение выполняется на корневой заказ"
    order_id: Int!
    "ID курьеров (для обычного заказа — ровно один)"
    courier_ids: [Int!]!
  ): DefaultResponse @guard @field(resolver: "Delivery\\DeliveryAssignCouriers")
  @validator(class: "Delivery\\DeliveryAssignCouriersValidator")
  @can(model: "Admin", ability: "collectorOnShift")
}
