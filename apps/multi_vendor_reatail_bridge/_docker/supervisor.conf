[supervisord]
nodaemon=true
user=root
loglevel=info
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
priority=5
autostart=true
autorestart=true
command=/usr/local/sbin/php-fpm --nodaemonize
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/fpm.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/worker.log
stopwaitsecs=3600

[program:outbox-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan rb:publish-outbox --loop
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/outbox.log
stopwaitsecs=3600

[program:consume-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan rabbitmq:consume-all
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/consume.log
stopwaitsecs=3600

[program:scheduler]
process_name=%(program_name)s
command=php /var/www/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/scheduler.log
stopwaitsecs=60
