mutation AttributeCreate($title: String!, $code: String!, $description: String, $type_id: Int, $category_type_id: Int, $is_default: Boolean, $values: [AttributeValueInput]) {
  AttributeCreate(title: $title, code: $code, description: $description, type_id: $type_id, category_type_id: $category_type_id, is_default: $is_default, values: $values) {
    code
    message
  }
}
