mutation ConfigurableProductRemoveAttributeValue(
  $parent_id: Int!
  $attribute_id: Int!
  $attribute_value_id: Int!
) {
  ConfigurableProductRemoveAttributeValue(
    parent_id: $parent_id
    attribute_id: $attribute_id
    attribute_value_id: $attribute_value_id
  ) {
    status
    message
    deleted_variant_ids
    blocked_by_orders
  }
}
