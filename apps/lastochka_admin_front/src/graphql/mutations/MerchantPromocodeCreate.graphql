mutation ($input: CreateMerchantPromocodeInput!) {
  createMerchantPromocode(input: $input) {
    id
    title
    code
    scope
    discount_percent
    discount_type
    discount_value
    binding_type
    valid_from
    valid_to
    is_active
    max_uses
    max_uses_per_client
    used_count
    status
    shop {
      id
      title
    }
  }
}
