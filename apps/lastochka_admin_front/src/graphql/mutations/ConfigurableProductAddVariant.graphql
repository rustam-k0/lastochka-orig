mutation ConfigurableProductAddVariant(
  $parent_id: Int!
  $attribute_values: [VariantAttributeValueInput!]!
  $sku: String
  $price: Float
  $stock: Int
  $title: String
  $img: ImgInput
  $images: [ImgInput]
) {
  ConfigurableProductAddVariant(
    parent_id: $parent_id
    attribute_values: $attribute_values
    sku: $sku
    price: $price
    stock: $stock
    title: $title
    img: $img
    images: $images
  ) {
    code
    message
    variant_id
  }
}
