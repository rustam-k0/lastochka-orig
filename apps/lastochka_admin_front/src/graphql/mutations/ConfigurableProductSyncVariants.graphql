mutation ConfigurableProductSyncVariants(
  $parent_id: Int!
  $attribute_id: Int!
  $attribute_value_id: Int!
  $combinations_to_create: [CombinationInput!]!
) {
  ConfigurableProductSyncVariants(
    parent_id: $parent_id
    attribute_id: $attribute_id
    attribute_value_id: $attribute_value_id
    combinations_to_create: $combinations_to_create
  ) {
    code
    message
    variant_ids
  }
}
