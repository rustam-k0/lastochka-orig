mutation(
  $id: Int
  $title: String
  $city_id: Int
  $is_default: Boolean
  $phone: String
  $email: String
  $slot_time: Int
  $slot_max_orders: Int
  $longitude: Float
  $latitude: Float
  $address: String
  $commission: Float
  $area_sqm: Float
  $type_id: Int
  $schedule: String
  $description: String
  $deposit: Float
  $img: ImgInput
  $payment_type_id: Int
  $logo_img: ImgInput
  $background_img: ImgInput
  $categories: [Int]
  $is_popular: Boolean
  $is_b2b: Boolean
  $ignore_stock: Boolean
  $is_bonus_enabled: Boolean
  $bonus_earn_percent: Int
  $bonus_spend_percent: Int
  $heavy_order_threshold: Int
  $assembly_price: Int
  $custom_checkboxes: String
) {
  ShopCreate(
    id: $id
    title: $title
    city_id: $city_id
    is_default: $is_default
    phone: $phone
    email: $email
    slot_time: $slot_time
    slot_max_orders: $slot_max_orders
    longitude: $longitude
    latitude: $latitude
    schedule: $schedule
    payment_type_id: $payment_type_id
    address: $address
    commission: $commission
    area_sqm: $area_sqm
    type_id: $type_id
    description: $description
    deposit: $deposit
    img: $img
    logo_img: $logo_img
    background_img: $background_img
    categories: $categories
    is_popular: $is_popular
    is_b2b: $is_b2b
    ignore_stock: $ignore_stock
    is_bonus_enabled: $is_bonus_enabled
    bonus_earn_percent: $bonus_earn_percent
    bonus_spend_percent: $bonus_spend_percent
    heavy_order_threshold: $heavy_order_threshold
    assembly_price: $assembly_price
    custom_checkboxes: $custom_checkboxes
  ) {
    message
    code
  }
}
