mutation (
  $title: String!
  $shop_id: Int
  $shop_ids: [Int!]
  $all_shops: Boolean
  $link_type: MerchantBannerLinkType
  $product_id: Int
  $category_id: Int
  $display_category_id: Int
  $position: Int
  $is_active: Boolean
  $image: ImgInput
  $custom_checkboxes: String
) {
  merchantBannerCreate(
    input: {
      title: $title
      shop_id: $shop_id
      shop_ids: $shop_ids
      all_shops: $all_shops
      link_type: $link_type
      product_id: $product_id
      category_id: $category_id
      display_category_id: $display_category_id
      position: $position
      is_active: $is_active
      image: $image
      custom_checkboxes: $custom_checkboxes
    }
  ) {
    id
    title
  }
}
