mutation(
  $id: Int
  $articul: String
  $title: String
  $description: String
  $additional_info: String
  $meta_title: String
  $meta_description: String
  $meta_keywords: String
  $weight: Int
  $price: Float
  $price_tiers: [PriceTierInput!]
  $category_ids: [Int!]
  $attributes: [AttributeInput]
  $supplements: [SupplementInput]
  $img: ImgInput
  $images: [ImgInput]
  $cook_start_time: String
  $cook_end_time: String
  $info_weight_type_id: Int
  $info_weight: Int
  $manual_quantum_step: Int
  $manual_quantum_unit_type_id: Int
  $stock_quantity: Float
  $shop_id: Int
  $brand_id: Int
  $video_path: String
  $is_culinary: Boolean
  $sugar_free: Boolean
  $on_search_page: Boolean
  $served_warm: Boolean
  $pickup_only: Boolean
  $adult_only: Boolean
  $is_marked: Boolean
  $is_new: Boolean
  $is_hurry_up: Boolean
  $vat_code: Int
  $stock_mode: String
  $fixed_stock_quantity: Int
  $fixed_stock_unit_type_id: Int
  $ready_fixed_time: String
  $custom_checkboxes: String
) {
  ProductUpdate(
    id: $id
    articul: $articul
    title: $title
    description: $description
    additional_info: $additional_info
    meta_title: $meta_title
    meta_description: $meta_description
    meta_keywords: $meta_keywords
    weight: $weight
    price: $price
    price_tiers: $price_tiers
    category_ids: $category_ids
    attributes: $attributes
    supplements: $supplements
    img: $img
    images: $images
    cook_start_time: $cook_start_time
    cook_end_time: $cook_end_time
    info_weight: $info_weight
    info_weight_type_id: $info_weight_type_id
    manual_quantum_step: $manual_quantum_step
    manual_quantum_unit_type_id: $manual_quantum_unit_type_id
    stock_quantity: $stock_quantity
    shop_id: $shop_id
    brand_id: $brand_id
    video_path: $video_path
    is_culinary: $is_culinary
    sugar_free: $sugar_free
    on_search_page: $on_search_page
    served_warm: $served_warm
    pickup_only: $pickup_only
    adult_only: $adult_only
    is_marked: $is_marked
    is_new: $is_new
    is_hurry_up: $is_hurry_up
    vat_code: $vat_code
    stock_mode: $stock_mode
    fixed_stock_quantity: $fixed_stock_quantity
    fixed_stock_unit_type_id: $fixed_stock_unit_type_id
    ready_fixed_time: $ready_fixed_time
    custom_checkboxes: $custom_checkboxes
  ) {
    code
    message
  }
}
