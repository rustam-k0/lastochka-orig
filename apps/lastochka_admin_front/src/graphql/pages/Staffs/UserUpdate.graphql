mutation(
  $id: Int
  $name: String,
  $surname: String,
  $patronymic: String,
  $phone: String,
  $email: String
  $role_id: Int,
  $shops: [Int],
  $password: String,
  $password_confirmation: String
) {
  UserUpdate(
    id: $id
    name: $name
    surname: $surname
    patronymic: $patronymic
    phone: $phone
    email: $email
    role_id: $role_id
    shops: $shops
    password: $password
    password_confirmation: $password_confirmation
  ) {
    code
    message
  }
}
