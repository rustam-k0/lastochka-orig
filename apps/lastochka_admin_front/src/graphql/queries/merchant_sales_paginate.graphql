query (
  $first: Int
  $page: Int
  $shop_id: Int
  $status: MerchantSaleStatus
  $search: String
  $ordering: [DefaultOrdering]
) {
  merchantSales(
    first: $first
    page: $page
    shop_id: $shop_id
    status: $status
    search: $search
    ordering: $ordering
  ) {
    data {
      id
      title
      description
      discount_percent
      starts_at
      ends_at
      is_active
      status
      products_count
      image {
        id
        path
      }
      shop {
        id
        title
      }
    }
    paginatorInfo {
      currentPage
      lastPage
      total
      perPage
    }
  }
}
