query (
  $first: Int
  $page: Int
  $shop_id: Int
  $is_active: Boolean
  $link_type: MerchantBannerLinkType
  $search: String
  $ordering: [DefaultOrdering]
) {
  merchantBanners(
    first: $first
    page: $page
    shop_id: $shop_id
    is_active: $is_active
    link_type: $link_type
    search: $search
    ordering: $ordering
  ) {
    data {
      id
      title
      link_type
      display_category_id
      is_active
      position
      shop {
        id
        title
      }
      product {
        id
        title
      }
      category {
        id
        title
      }
      display_category {
        id
        title
      }
      image {
        id
        path
      }
    }
    paginatorInfo {
      currentPage
      lastPage
      total
      perPage
    }
  }
}
