query IntegrationConfigs($shop_id: Int) {
  integrationConfigs(shop_id: $shop_id) {
    id
    integration_type
    driver
    credentials
    is_active
    sync_categories_enabled
    sync_images_enabled
    deactivate_missing_enabled
    tested_at
    test_error
    shop_id
    shop {
      id
      title
      code
    }
  }
}
