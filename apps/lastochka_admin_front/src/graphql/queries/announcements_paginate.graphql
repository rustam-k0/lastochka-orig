query announcements_paginate($first: Int!, $page: Int, $is_active: Boolean, $search: String, $promocode_id: Int) {
  announcements(first: $first, page: $page, is_active: $is_active, search: $search, promocode_id: $promocode_id) {
    data {
      id
      title
      short_description
      is_active
      promocode_id
      created_at
      updated_at
      promocode {
        id
        title
        discount_percent
      }
    }
    paginatorInfo {
      count
      currentPage
      firstItem
      hasMorePages
      lastItem
      lastPage
      perPage
      total
    }
  }
}