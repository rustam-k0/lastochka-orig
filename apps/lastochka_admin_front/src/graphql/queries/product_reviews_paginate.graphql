query ProductReviews(
  $page: Int
  $first: Int
  $shop_id: Int
  $product_id: Int
  $is_published: Boolean
  $rating: Int
  $search: String
  $ordering: [DefaultOrdering]
) {
  productReviews(
    page: $page
    first: $first
    shop_id: $shop_id
    product_id: $product_id
    is_published: $is_published
    rating: $rating
    search: $search
    ordering: $ordering
  ) {
    data {
      id
      shop_id
      product_id
      rating
      description
      is_published
      author_name
      author_phone
      created_at
      shop {
        id
        title
      }
      product {
        id
        title
      }
    }
    paginatorInfo {
      currentPage
      lastPage
      total
      perPage
    }
  }
}
