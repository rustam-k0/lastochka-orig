query (
  $first: Int
  $page: Int
  $shop_id: Int
  $is_active: Boolean
  $show_on_main: Boolean
  $show_on_merchant_page: Boolean
  $show_in_merchant_catalog: Boolean
  $search: String
  $ordering: [DefaultOrdering]
) {
  merchantProductGroups(
    first: $first
    page: $page
    shop_id: $shop_id
    is_active: $is_active
    show_on_main: $show_on_main
    show_on_merchant_page: $show_on_merchant_page
    show_in_merchant_catalog: $show_in_merchant_catalog
    search: $search
    ordering: $ordering
  ) {
    data {
      id
      title
      show_on_main
      show_on_merchant_page
      show_in_merchant_catalog
      show_on_search
      sort_order
      is_active
      is_recommended
      is_cart_page
      products_count
      fill_type
      image {
        id
        path
      }
      shop {
        id
        title
      }
    }
    paginatorInfo {
      currentPage
      lastPage
      total
      perPage
    }
  }
}
