query (
  $shop_id: Int!
  $search: String
  $first: Int
  $page: Int
) {
  shopProductsForSale(
    shop_id: $shop_id
    search: $search
    first: $first
    page: $page
  ) {
    data {
      id
      title
      default_price {
        value
      }
      images {
        id
        path
      }
    }
    paginatorInfo {
      currentPage
      lastPage
      total
      perPage
    }
  }
}
