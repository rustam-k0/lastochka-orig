query ($first: Int, $page: Int, $shop_id: Int, $code: String!) {
  oneCProblemProducts(first: $first, page: $page, shop_id: $shop_id, code: $code) {
    data {
      id
      shop_id
      shop_title
      code
      external_id
      sku
      name
      barcode
      local_product_id
      created_at
    }
    paginatorInfo {
      total
    }
  }
}
