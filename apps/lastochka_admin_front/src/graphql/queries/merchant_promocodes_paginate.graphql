query merchant_promocodes_paginate(
  $first: Int
  $page: Int
  $shop_id: Int
  $is_active: Boolean
  $status: String
  $search: String
  $ordering: [DefaultOrdering]
) {
  merchantPromocodes(
    first: $first
    page: $page
    shop_id: $shop_id
    is_active: $is_active
    status: $status
    search: $search
    ordering: $ordering
  ) {
    data {
      id
      shop_id
      scope
      title
      code
      discount_percent
      discount_type
      discount_value
      binding_type
      valid_from
      valid_to
      is_active
      is_valid
      status
      max_uses
      max_uses_per_client
      used_count
      created_at
      shop {
        id
        title
      }
    }
    paginatorInfo {
      currentPage
      lastPage
      total
      perPage
    }
  }
}
