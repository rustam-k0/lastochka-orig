; PHP-лимиты для обмена 1С (CommerceML) — читаются PHP-FPM из каталога public/ этого приложения.
;
; Зачем: 1С выгружает каталог zip-частями. Каталог среднего магазина (~9k товаров + картинки)
; даёт части по ~50 МБ. Дефолтные PHP-лимиты (post_max_size=8M, upload_max_filesize=2M,
; memory_limit=128M) при этом:
;   1) отбрасывают тело POST  -> приложение отдаёт пустой ответ -> 1С пишет
;      «Получен пустой ответ сервера. Файл не отправлен» (mode=file);
;   2) падают в "Allowed memory size exhausted" при чтении тела в память.
; На общем php-fpm pool это вдобавок забивает все воркеры и кладёт весь сайт.
; Инцидент: 09.06.2026, Foodlink, обмен ТСК (~8.6k товаров, zip ~48.8 МБ) — лёг Bagisto и курьерская.
;
; Этот .user.ini — baseline-страховка в коде (переживает redeploy, раскатывается на форки).
; На проде дополнительно рекомендуется выделенный php-fpm pool для 1c-exchange (изоляция от
; основного pool) — см. learnings.md проекта, секция про инцидент 2026-06-09.
post_max_size = 512M
upload_max_filesize = 512M
memory_limit = 768M
max_execution_time = 600
max_input_time = 600
